<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <link rel="icon" type="image/x-icon" href="/images/logo.png" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link href="/styles.css" rel="stylesheet" />
    <link href="/badminton/app.css" rel="stylesheet" />
    <title>MK3 Badminton Club</title>
  </head>
  <body class="d-flex flex-column min-vh-100">
    <!-- Shared site navbar (components/navbar.html) -->
    <div id="navbar"></div>

    <!-- Club bar: title, demo role switcher, section navigation -->
    <header class="club-bar border-bottom">
      <div class="container py-2 d-flex flex-wrap align-items-center gap-2 justify-content-between">
        <a href="#/" class="club-title text-decoration-none d-flex align-items-center gap-2">
          <span class="club-dot" aria-hidden="true"></span>
          <span><strong>San Diego Badminton Academy</strong> <span class="text-muted small d-none d-sm-inline">by MK3 Sportz</span></span>
        </a>
        <div class="d-flex align-items-center gap-2">
          <label for="roleSwitch" class="small text-muted mb-0">Demo role</label>
          <select id="roleSwitch" class="form-select form-select-sm" style="width: auto">
            <option value="member">Adult Member</option>
            <option value="admin">Admin</option>
          </select>
          <button class="btn btn-sm btn-outline-secondary" data-action="reset-demo" title="Reset demo data">Reset</button>
        </div>
      </div>
      <div class="container">
        <nav class="nav nav-underline club-nav flex-nowrap overflow-auto" aria-label="Club sections">
          <a class="nav-link" data-nav="home" href="#/">Home</a>
          <a class="nav-link d-none" id="navAdmin" data-nav="admin" href="#/admin">Admin Dashboard</a>
          <a class="nav-link" data-nav="classes" href="#/classes">Classes</a>
          <a class="nav-link" data-nav="tournaments" href="#/tournaments">Tournaments</a>
          <a class="nav-link" data-nav="calendar" href="#/calendar">Calendar &amp; Registration</a>
          <a class="nav-link" data-nav="recognition" href="#/recognition">Player Recognition</a>
          <a class="nav-link" data-nav="communications" href="#/announcements">Communications <span id="navUnread" class="badge rounded-pill text-bg-danger d-none"></span></a>
        </nav>
      </div>
    </header>

    <div class="container mt-3">
      <div id="viewingAs" class="small text-muted"></div>
    </div>

    <main id="app" class="container my-3 flex-grow-1" tabindex="-1"></main>

    <!-- Shared event / registration modal -->
    <div class="modal fade" id="eventModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable modal-fullscreen-sm-down">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="eventModalTitle"></h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body" id="eventModalBody"></div>
        </div>
      </div>
    </div>

    <div class="toast-container position-fixed bottom-0 end-0 p-3" id="toasts"></div>

    <!-- Shared site footer (components/footer.html) -->
    <div id="footer"></div>

    <script src="/badminton/app.js"></script>
  </body>
</html>
