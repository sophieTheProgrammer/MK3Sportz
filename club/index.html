<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <link rel="icon" type="image/x-icon" href="/images/logo.png" id="favicon" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link href="/styles.css" rel="stylesheet" />
    <link href="/club/app.css" rel="stylesheet" />
    <title>MK3 Sportz Club</title>
    <!-- One page for every sport: /badminton/, /pickleball/ (sets the colour theme before paint) -->
    <script>document.documentElement.dataset.sport = location.pathname.split("/")[1];</script>
  </head>
  <body class="d-flex flex-column min-vh-100">
    <!-- Shared site navbar (components/navbar.html) -->
    <div id="navbar"></div>

    <!-- Club bar: title, admin sign-in controls, section navigation -->
    <header class="club-bar border-bottom">
      <div class="container py-2 d-flex flex-wrap align-items-center gap-2 justify-content-between">
        <a href="#/" class="club-title text-decoration-none d-flex align-items-center gap-2">
          <img id="clubLogo" class="club-logo" src="data:," alt="" width="160" height="194" hidden />
          <span><strong id="clubName"></strong> <span class="text-muted small d-none d-sm-inline" id="clubByline"></span></span>
        </a>
        <div class="d-flex flex-wrap align-items-center gap-2" id="authControls">
          <!-- Shown only to a signed-in admin: switch to a preview of the public site (visitors have no
               accounts). The Admin view needs a server-side Google session, so it can't grant admin access. -->
          <span id="viewSwitch" class="d-none d-inline-flex align-items-center gap-2">
            <label for="roleSwitch" class="small text-muted mb-0">View</label>
            <select id="roleSwitch" class="form-select form-select-sm" style="width: auto">
              <option value="admin">Admin</option>
              <option value="member">Public site (preview)</option>
            </select>
          </span>
          <a href="admin-sign-in.html" id="adminSignInBtn" class="btn btn-sm btn-outline-secondary">Admin Sign In</a>
          <button type="button" id="resetBtn" class="btn btn-sm btn-outline-secondary d-none" data-action="reset-demo" title="Reset the demo data on the server">Reset demo</button>
          <button type="button" id="signOutBtn" class="btn btn-sm btn-outline-danger d-none" data-action="sign-out">Sign Out</button>
        </div>
      </div>
      <div class="container">
        <nav class="nav nav-underline club-nav flex-nowrap overflow-auto" aria-label="Club sections">
          <a class="nav-link" data-nav="home" href="#/">Home</a>
          <a class="nav-link d-none" id="navAdmin" data-nav="admin" href="#/admin">Admin Dashboard</a>
          <a class="nav-link" data-nav="classes" href="#/classes">Classes</a>
          <a class="nav-link" data-nav="tournaments" href="#/tournaments">Tournaments</a>
          <a class="nav-link" data-nav="calendar" href="#/calendar">Calendar &amp; Registration</a>
          <a class="nav-link" data-nav="recognition" href="#/recognition">Player Recognition</a>
          <a class="nav-link" data-nav="communications" href="#/announcements">Communications <span id="navUnread" class="badge rounded-pill text-bg-danger d-none"></span></a>
          <a class="nav-link" data-nav="brand" href="#/brand">Logos &amp; Apparel</a>
        </nav>
      </div>
    </header>

    <div class="container mt-3">
      <div id="viewingAs" class="small text-muted"></div>
    </div>

    <main id="app" class="container my-3 flex-grow-1" tabindex="-1"></main>

    <!-- Shared event / registration modal -->
    <div class="modal fade" id="eventModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable modal-fullscreen-sm-down">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="eventModalTitle"></h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body" id="eventModalBody"></div>
        </div>
      </div>
    </div>

    <div class="toast-container position-fixed bottom-0 end-0 p-3" id="toasts"></div>

    <!-- Shared site footer (components/footer.html) -->
    <div id="footer"></div>

    <script src="/club/club-core.js"></script>
    <script src="/club/sports/badminton.js"></script>
    <script src="/club/sports/pickleball.js"></script>
    <script src="/club/app.js"></script>
  </body>
</html>
