<div class="container-fluid my-5 d-flex justify-content-center">
  <div class="card shadow" style="width: 100%">
    <div class="ratio ratio-16x9">
      <iframe
        src="{{mapSrc}}"
        style="border: 0"
        allowfullscreen=""
        loading="lazy"
        referrerpolicy="no-referrer-when-downgrade"
        title="Google Maps location of Black Mountain Pkwy, San Diego"
      ></iframe>
    </div>
    <div class="card-body text-center">
      <a
        href="https://www.google.com/maps/place/Black+Mountain+Pkwy,+San+Diego,+CA+92127"
        target="_blank"
        rel="noopener noreferrer"
        class="btn btn-primary mb-2"
        aria-label="Open Black Mountain Parkway location in Google Maps"
      >
        Open in Google Maps
      </a>
      <p class="text-muted small mb-0">
        If the location change presents a challenge, we can explore a carpool
        option…
      </p>
    </div>
  </div>
</div>
