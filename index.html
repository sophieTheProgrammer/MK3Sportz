<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <link rel="icon" type="image/x-icon" href="/images/logo.png" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mustache@4.2.0/mustache.min.js"></script>
    <link href="/styles.css" rel="stylesheet" />
    <title>MK3 Sportz</title>
  </head>
  <body class="d-flex flex-column min-vh-100">
    <div id="navbar"></div>

    <div id="gallery"></div>

    <div class="container mt-5 text-center">
      <p class="lead">
        We are a non-profit organization fostering a fun, safe, and secure
        environment for students to thrive.
      </p>
      <p class="lead">Mr. Floyd is an experienced player, and can teach athletes at all skill levels.</p>
      <p class="lead">Where sports and fun come together!</p>

      <h2 class="mt-5 mb-4">Sports Offered</h2>

      <div class="container py-4">
        <div class="d-flex flex-wrap justify-content-center gap-4">
          <a
            href="sports/basketball.html"
            class="text-decoration-none text-center"
          >
            <div class="icon-circle bg-primary">
              <img src="/images/Basketball Vector Icon.svg" />
            </div>
            <div class="mt-2 text-dark fw-medium">Basketball</div>
          </a>

          <a
            href="sports/pickleball.html"
            class="text-decoration-none text-center"
          >
            <div class="icon-circle" style="background-color: #f4b400">
              <img src="/images/Pickleball Icon.svg" />
            </div>
            <div class="mt-2 text-dark fw-medium">Pickleball</div>
          </a>

          <a href="sports/soccer.html" class="text-decoration-none text-center">
            <div class="icon-circle" style="background-color: #0f9d58">
              <img src="/images/Soccer Ball Emoji Black.svg" />
            </div>
            <div class="mt-2 text-dark fw-medium">Soccer</div>
          </a>

          <a
            href="sports/badminton.html"
            class="text-decoration-none text-center"
          >
            <div class="icon-circle" style="background-color: #ea4335">
              <img
                src="https://www.freeiconspng.com/uploads/shuttlecock-icon-17.png"
                alt="Badminton icon from freeiconspng.com"
              />
                        </div>
            <div class="mt-2 text-dark fw-medium">Badminton</div>
          </a>
        </div>
      </div>

  
    </div>

    <div id="footer"></div>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="/script.js"></script>
  </body>
</html>
